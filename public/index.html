<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console logistique Kadesh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div id="boot" class="boot">
  <div class="boot__mark">KDS</div>
  <p class="boot__line">Opening console…</p>
</div>

<div id="shell" class="shell" hidden>

  <header class="topbar">
    <a class="brand" href="#/missions">
      <span class="brand__mark">KDS</span>
      <span class="brand__text">
        <strong>Console logistique</strong>
        <em id="factionName">Kadesh</em>
      </span>
    </a>

    <div class="sync" id="syncPill" title="Dernier relevé de l'API darkstat">
      <span class="sync__dot"></span>
      <span class="sync__label">Last reading</span>
      <span class="sync__value" id="syncAge">—</span>
    </div>

    <div class="who" id="whoami"></div>
  </header>

  <nav class="rail" id="rail">
    <a href="#/missions" data-nav="missions"><span class="rail__key">M</span><span class="rail__label">Missions</span></a>
    <a href="#/mine"     data-nav="mine"><span class="rail__key">E</span><span class="rail__label">My runs</span><b id="mineBadge" class="rail__badge" hidden>0</b></a>
    <a href="#/stations" data-nav="stations"><span class="rail__key">S</span><span class="rail__label">Holds</span></a>
    <a href="#/recipes"  data-nav="recipes"><span class="rail__key">A</span><span class="rail__label">Armory</span></a>
    <a href="#/routes"   data-nav="routes"><span class="rail__key">R</span><span class="rail__label">Routes</span></a>
    <a href="#/board"    data-nav="board"><span class="rail__key">C</span><span class="rail__label">Standings</span></a>
    <a href="#/admin"    data-nav="admin" id="navAdmin" hidden><span class="rail__key">⚙</span><span class="rail__label">Manage</span></a>
  </nav>

  <main class="stage" id="stage"></main>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="modal" class="modal" hidden></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
