# =====================================================================
#  Console Kadesh — proxy inverse nginx
#
#  Déposer dans /etc/nginx/sites-available/kadesh puis :
#      sudo ln -s /etc/nginx/sites-available/kadesh /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#
#  Le certificat TLS s'obtient ensuite avec :
#      sudo certbot --nginx -d logistique.exemple.fr
#  Certbot réécrit ce fichier pour ajouter l'écoute en 443 et la
#  redirection depuis le port 80.
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name logistique.exemple.fr;   # ← à remplacer

    # Journaux dédiés, plus faciles à lire que ceux du site par défaut.
    access_log /var/log/nginx/kadesh-acces.log;
    error_log  /var/log/nginx/kadesh-erreurs.log;

    # Taille de corps suffisante pour l'import de recettes.
    client_max_body_size 2m;

    # -----------------------------------------------------------------
    # Flux temps réel (Server-Sent Events).
    #
    # Ce bloc doit précéder le bloc « / » : nginx retient la correspondance
    # exacte la plus longue. Sans lui, la mise en tampon par défaut retient
    # les événements jusqu'à la fermeture de la connexion, et l'interface
    # ne se met jamais à jour toute seule.
    # -----------------------------------------------------------------
    location /api/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # La connexion reste ouverte en permanence : sans ce délai relevé,
        # nginx la coupe toutes les 60 s et le client se reconnecte en boucle.
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # ----------------------------------------------------------- le reste
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pas d'en-têtes WebSocket ici : le temps réel passe par les
        # Server-Sent Events, traités dans le bloc /api/events ci-dessus.

        proxy_read_timeout 120s;
    }

    # Les fichiers statiques sont versionnés par le serveur applicatif ;
    # on laisse simplement nginx compresser ce qui peut l'être.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
